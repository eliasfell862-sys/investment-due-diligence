[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-trading-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "psutil==7.0.0",
  "pywinauto==0.6.9",
  "winrt-runtime==3.2.1",
  "winrt-Windows.Globalization==3.2.1",
  "winrt-Windows.Foundation==3.2.1",
  "winrt-Windows.Foundation.Collections==3.2.1",
  "winrt-Windows.Graphics.Imaging==3.2.1",
  "winrt-Windows.Media.Ocr==3.2.1",
  "winrt-Windows.Storage.Streams==3.2.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[project.scripts]
trading-bridge = "trading_bridge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
